<!doctype html>
<html lang="ja" class="gate-locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成人向けコンテンツ | あさりちゃんの部屋</title>
<!-- 検索結果に出さない -->
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../style.css?v=6">
<script>
  // 前回「はい」を押していれば、描画前にロックを外す（ゲートが一瞬出るのを防ぐ）
  (function () {
    try {
      var until = Number(localStorage.getItem("ageOkUntil") || 0);
      if (until > Date.now()) document.documentElement.classList.remove("gate-locked");
    } catch (e) { /* 保存できない環境では毎回確認 */ }
  })();
</script>
</head>
<body>

<!-- ===== 年齢確認ゲート ===== -->
<section id="age-gate" role="dialog" aria-labelledby="gate-title">
  <div class="gate-card">
    <div class="gate-badge">R-18</div>
    <h1 id="gate-title">年齢確認</h1>
    <p>この先には、18歳未満の方の閲覧に適さない内容が含まれています。</p>
    <p>あなたは18歳以上ですか？</p>
    <p class="note">登場人物はすべて18歳以上です。</p>

    <div class="gate-buttons">
      <button id="gate-yes" type="button">はい（18歳以上）</button>
      <a id="gate-no" href="../">いいえ（トップに戻る）</a>
    </div>

    <label class="gate-remember">
      <input type="checkbox" id="gate-remember" checked>
      30日間この確認を表示しない
    </label>

    <noscript>
      <p class="note">このページの閲覧にはJavaScriptを有効にしてください。</p>
    </noscript>
  </div>
</section>

<!-- ===== 本文（確認後に表示） ===== -->
<div id="site">
  <header class="site-header">
    <div class="wrap">
      <p class="site-title"><a href="../">あさりちゃんの部屋</a></p>
      <nav class="site-nav">
        <a href="../">トップへ戻る</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section>
      <h2>成人向けコンテンツ</h2>
      <p>ここに成人向けの内容や、作品の販売・告知情報を書きます。</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap"><p>&copy; あさりちゃんの部屋</p></div>
  </footer>
</div>

<script>
  document.getElementById("gate-yes").addEventListener("click", function () {
    if (document.getElementById("gate-remember").checked) {
      try {
        localStorage.setItem("ageOkUntil", String(Date.now() + 30 * 864e5));
      } catch (e) { /* 保存できなくても今回は通す */ }
    }
    document.documentElement.classList.remove("gate-locked");
    window.scrollTo(0, 0);
  });
</script>
</body>
</html>
